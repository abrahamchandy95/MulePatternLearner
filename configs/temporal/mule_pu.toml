# Generic example. Set snapshot identity and dates for your own source.
task = "mule_pu"
stage = "artifacts/temporal/stage"
snapshots = "artifacts/temporal/snapshots_v2"
labels = "artifacts/temporal/stage/account_labels.parquet"
variant = "temporal"
hidden = 32
dropout = 0.15
fanouts = [8, 4]
epochs = 30
steps_per_epoch = 20
patience = 6
batch_size = 256
learning_rate = 0.001
reveal_fraction = 0.5
class_prior = 0.01
dark_ring_ids = []
seed = 42
split_seed = 42
device = "cpu"
threads = 4
mask_source = "resample"

[dates]
train = ["2024-04-01", "2024-05-01", "2024-06-01", "2024-07-01", "2024-08-01", "2024-09-01"]
validation = ["2024-10-01", "2024-11-01"]
test = ["2024-12-01", "2025-01-01"]
