# Generic example. Set snapshot identity and dates for your own source.
task = "zelle_forecast"
stage = "artifacts/temporal/stage"
snapshots = "artifacts/temporal/snapshots_v2"
horizon_days = 30
variant = "temporal"
hidden = 32
dropout = 0.15
fanouts = [8, 4]
epochs = 20
steps_per_epoch = 20
patience = 5
batch_size = 256
learning_rate = 0.001
seed = 42
split_seed = 42
device = "cpu"
threads = 4

[dates]
train = ["2024-04-01", "2024-05-01", "2024-06-01", "2024-07-01", "2024-08-01", "2024-09-01"]
validation = ["2024-10-01"]
test = ["2024-11-01", "2024-12-01"]
