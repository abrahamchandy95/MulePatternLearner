[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mule-pattern-learner"
version = "0.1.0"
description = "Account-level mule detection on TigerGraph"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Abraham Chandy" }]
dependencies = [
    "pyTigerGraph>=1.8",
    "numpy>=2.2",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "requests>=2.31",
    "scikit-learn>=1.6",
    # Not imported here: pyTigerGraph parses query responses with orjson when it is
    # installed, which is faster than the standard json module on every batch.
    "orjson>=3.10",
]

[project.optional-dependencies]
model = ["torch>=2.9"]
# GPU neighbor resampling for the live temporal trainer (Linux x86_64 with CUDA). Pick the
# extra that matches the CUDA major version of the installed torch wheel: cu12 wheels are on
# pypi.nvidia.com (use with torch cu129), cu13 wheels are on pypi.org (torch>=2.13 cu130/cu132).
cuda12 = [
    "pylibcugraph-cu12==26.8.*; sys_platform == 'linux'",
    "cupy-cuda12x>=14.0.1,!=14.1.0; sys_platform == 'linux'",
]
cuda13 = [
    "pylibcugraph-cu13==26.8.*; sys_platform == 'linux'",
    "cupy-cuda13x>=14.0.1,!=14.1.0; sys_platform == 'linux'",
]
# Dev tooling.
dev = [
    "pytest>=8.3",
    "basedpyright>=1.21",
    "ruff>=0.9",
]
all = ["mule-pattern-learner[model,dev]"]

[project.scripts]
mule-temporal = "mule_pattern_learner.temporal.live.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mule_pattern_learner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.basedpyright]
include = ["src", "tests", "scripts"]
exclude = ["**/__pycache__", ".venv"]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.12"
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "warning"
reportUnknownLambdaType = "warning"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint.isort]
# Sort plain `import x` and `from x import y` together by module name within
# each section, rather than grouping all `import x` lines first. This matches
# the import ordering used throughout the codebase.
force-sort-within-sections = true
