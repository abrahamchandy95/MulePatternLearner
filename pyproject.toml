[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mule-pattern-learner"
version = "0.1.0"
description = "Account-level mule detection on TigerGraph"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Abraham Chandy" }]
dependencies = [
    "pyTigerGraph>=1.8",
    "numpy>=2.2",
    "pandas>=3.0",
    "pyarrow>=18.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "requests>=2.31",
    "scikit-learn>=1.6",
    # Not imported here: pyTigerGraph parses query responses with orjson when it is
    # installed, which is faster than the standard json module on every batch.
    "orjson>=3.10",
    "torch>=2.9",
    "torch_geometric>=2.7",
]

[project.optional-dependencies]
# Dev tooling.
dev = [
    "pytest>=8.3",
    "basedpyright>=1.21",
    "ruff>=0.9",
    "import-linter>=2.15",
]

[project.scripts]
mule = "mule_pattern_learner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mule_pattern_learner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the installed package (pip install -e), never src/ through sys.path. Tests
# marked graph need TigerGraph, so they are deselected unless -m names them: a -m on the
# command line replaces this one, and -m "" runs all.
addopts = ["--import-mode=importlib", "-m", "not graph"]
markers = [
    "graph: needs the TigerGraph named in .env; excluded by default (-m graph)",
]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.12"
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "warning"
reportUnknownLambdaType = "warning"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# The default rules plus import sorting, so `ruff check` alone gates the import order.
extend-select = ["I"]

[tool.ruff.lint.isort]
# Sort plain `import x` and `from x import y` together by module name within
# each section, rather than grouping all `import x` lines first. This matches
# the import ordering used throughout the codebase.
force-sort-within-sections = true

[tool.importlinter]
root_package = "mule_pattern_learner"
include_external_packages = true

# The import rules of docs/design.md ("Package layout" and the leak rules), each holding
# without exceptions; tests/test_import_contracts.py runs them. The layers are exhaustive,
# so every new top-level module must be placed in one; a layer in parentheses is optional
# until its module exists. A layer imports only the layers below it, and the modules of
# one layer, split by "|", never import each other. The commands sit alone at the top,
# since they run parity (testing code) and the benchmark; testing (the reference graph and
# parity, which may read every column) and the benchmark sit under them. evaluation, the
# only package that reads the answer key for a result, sits above everything that builds
# examples, batches or models; and comparisons above training, since XGBoost chooses its
# rounds by training's selection score.

[[tool.importlinter.contracts]]
name = "Layers run one way"
type = "layers"
containers = ["mule_pattern_learner"]
# __main__ only runs the CLI and nothing imports it.
exhaustive = true
exhaustive_ignores = ["__main__"]
layers = [
    "cli",
    "testing | (bench)",
    "evaluation",
    "(comparisons)",
    "training",
    "data | subgraph",
    "tigergraph | model",
    "runtime | metrics",
    "config | paths | contract",
]

[[tool.importlinter.contracts]]
name = "The model knows nothing about storage"
type = "forbidden"
source_modules = ["mule_pattern_learner.model"]
forbidden_modules = ["pandas", "pyarrow", "requests", "pyTigerGraph"]

[[tool.importlinter.contracts]]
name = "Nothing that builds examples, batches or models reads evaluation or testing"
type = "forbidden"
# Indirect imports count too, so nothing these packages import may import either. A
# forbidden contract refuses a module that does not exist, so comparisons joins the list
# with its package; until then nothing of it can import anything.
source_modules = [
    "mule_pattern_learner.tigergraph",
    "mule_pattern_learner.data",
    "mule_pattern_learner.subgraph",
    "mule_pattern_learner.model",
    "mule_pattern_learner.training",
]
forbidden_modules = ["mule_pattern_learner.evaluation", "mule_pattern_learner.testing"]

[[tool.importlinter.contracts]]
name = "Only evaluation and testing import the answer key's parser"
type = "forbidden"
# The Labels guard: read_answer_key's parser reads the truth, so no package but evaluation and
# testing imports it, directly or not. The registry names the query without importing its
# module; tests/tigergraph/test_infrastructure_rows.py holds the modules of tigergraph to that,
# since an import inside one package is not a contract's to see. comparisons joins the list
# with its package.
source_modules = [
    "mule_pattern_learner.tigergraph",
    "mule_pattern_learner.data",
    "mule_pattern_learner.subgraph",
    "mule_pattern_learner.model",
    "mule_pattern_learner.training",
]
forbidden_modules = ["mule_pattern_learner.tigergraph.queries.read_answer_key"]
