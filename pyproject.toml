[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mule-pattern-learner"
version = "0.1.0"
description = "Account-level mule detection on TigerGraph"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Abraham Chandy" }]
dependencies = [
    "pyTigerGraph>=1.8",
    "numpy>=2.2",
    "pandas>=2.2",
    "pyarrow>=18.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "requests>=2.31",
    "scikit-learn>=1.6",
    # Not imported here: pyTigerGraph parses query responses with orjson when it is
    # installed, which is faster than the standard json module on every batch.
    "orjson>=3.10",
    "torch>=2.9",
    "torch_geometric>=2.7",
]

[project.optional-dependencies]
# Dev tooling.
dev = [
    "pytest>=8.3",
    "basedpyright>=1.21",
    "ruff>=0.9",
    "import-linter>=2.15",
]

[project.scripts]
mule = "mule_pattern_learner.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mule_pattern_learner"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import the installed package (pip install -e), never src/ through sys.path. Tests
# marked graph need TigerGraph, so they are deselected unless -m names them: a -m on the
# command line replaces this one, and -m "" runs all.
addopts = ["--import-mode=importlib", "-m", "not graph"]
markers = [
    "graph: needs the TigerGraph named in .env; excluded by default (-m graph)",
]

[tool.basedpyright]
include = ["src", "tests"]
exclude = ["**/__pycache__", ".venv"]
venvPath = "."
venv = ".venv"
typeCheckingMode = "strict"
pythonVersion = "3.12"
useLibraryCodeForTypes = true
reportMissingTypeStubs = "none"
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
reportUnknownParameterType = "warning"
reportUnknownLambdaType = "warning"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# The default rules plus import sorting, so `ruff check` alone gates the import order.
extend-select = ["I"]

[tool.ruff.lint.isort]
# Sort plain `import x` and `from x import y` together by module name within
# each section, rather than grouping all `import x` lines first. This matches
# the import ordering used throughout the codebase.
force-sort-within-sections = true

[tool.importlinter]
root_package = "mule_pattern_learner"
include_external_packages = true

# The import rules of docs/design.md for the packages that exist so far, each holding
# without exceptions; tests/test_import_contracts.py runs them. The layers are exhaustive,
# so every new top-level module must be placed in one. Nothing below evaluation imports
# it, so only evaluation reads the answer key. testing (the reference graph and the test
# world) sits beside cli at the top, so only the tests import it.

[[tool.importlinter.contracts]]
name = "Layers run one way"
type = "layers"
containers = ["mule_pattern_learner"]
# __main__ only runs the CLI and nothing imports it.
exhaustive = true
exhaustive_ignores = ["__main__"]
layers = [
    "cli | testing",
    "evaluation",
    "data",
    "tigergraph | model",
    "runtime | metrics",
    "config | paths",
]

[[tool.importlinter.contracts]]
name = "The model knows nothing about storage"
type = "forbidden"
source_modules = ["mule_pattern_learner.model"]
forbidden_modules = ["pandas", "pyarrow", "requests", "pyTigerGraph"]
